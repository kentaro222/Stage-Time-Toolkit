<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Stage Time Toolkit</title>

<link rel="stylesheet" type="text/css" href="dark.css">


<style>
    /* =========================================
       共通・ベーススタイル
       ========================================= */
    :root {
        --bg-color: #121212;
        --text-color: #e0e0e0;
        --panel-bg: #1e1e1e;
        --border-color: #333;
        --sw-accent: #00e676; /* ストップウォッチの色 */
        --sw-danger: #ff5252;
        --bt-accent: #e74c3c; /* バータイマーの色 */
    }
    * { box-sizing: border-box; }
    
    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: 'Helvetica Neue', Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
    }
    button { font-family: inherit; }

    /* --- タブメニュー --- */
    .tab-bar {
        display: flex;
        background-color: #161616;
        border-bottom: 1px solid var(--border-color);
        position: sticky;
        top: 0;
        z-index: 100;
    }
    .tab-btn {
        flex: 1; padding: 15px; background: none; border: none;
        color: #888; font-size: 1.1rem; cursor: pointer; transition: 0.2s;
        border-bottom: 3px solid transparent;
    }
    .tab-btn:hover { background-color: rgba(255,255,255,0.05); }
    .tab-btn.active { color: var(--text-color); font-weight: bold; }
    .tab-btn[data-target="app-stopwatch"].active { border-bottom-color: var(--sw-accent); }
    .tab-btn[data-target="app-bartimer"].active { border-bottom-color: var(--bt-accent); }

    /* --- アプリコンテナ --- */
    .app-container {
        display: none; flex-direction: column; align-items: center;
        padding: 20px; width: 100%; max-width: 800px; margin-inline: auto;
        flex-grow: 1; animation: fadeIn 0.3s ease;
    }
    .app-container.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* --- 共通コンポーネント (消灯防止ボタン等) --- */
    .status-btn {
        display: flex; align-items: center; gap: 8px;
        background: transparent; border: 1px solid var(--border-color);
        color: #888; padding: 5px 10px; border-radius: 6px;
        cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
    }
    .status-btn:hover { background-color: rgba(255,255,255,0.05); }
    .indicator-dot { width: 10px; height: 10px; border-radius: 50%; background-color: #555; }


    /* =========================================
       ストップウォッチ用スタイル
       ========================================= */
    #app-stopwatch .status-btn.active-lock { color: var(--text-color); border-color: var(--sw-accent); }
    #app-stopwatch .indicator-dot.active { background-color: var(--sw-accent); box-shadow: 0 0 8px var(--sw-accent); }
    
    #sw-time-display { font-size: 4.5rem; font-family: monospace; font-weight: bold; color: var(--sw-accent); margin: 10px 0 20px 0; letter-spacing: 3px; }
    #sw-status-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    
    .sw-controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .sw-controls button { background-color: var(--panel-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 15px 30px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .sw-controls button:active { transform: scale(0.95); }
    .sw-controls button.primary { background-color: var(--sw-accent); color: #000; font-weight: bold; }
    .sw-controls button.danger { border-color: var(--sw-danger); color: var(--sw-danger); }

    .sw-base-time-container { display: flex; align-items: center; gap: 8px; background-color: var(--panel-bg); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border-color); }
    #sw-base-time-input { background-color: transparent; color: var(--sw-accent); border: none; font-family: monospace; font-size: 1.1rem; outline: none; }
    #sw-base-time-input:disabled { color: #555; cursor: not-allowed; }

    .sw-record-container { width: 100%; background-color: var(--panel-bg); border-radius: 8px; padding: 15px; }
    .sw-record-header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .sw-record-note { color: #777; font-size: 0.8rem; }
    .sw-record-textarea { width: 100%; min-height: 220px; resize: vertical; padding: 12px; border-radius: 7px; border: 1px solid #555; background: #151515; color: white; font: 15px/1.6 monospace; outline: none; }
    .sw-record-textarea:focus { border-color: var(--sw-accent); }
    .sw-record-help { color: #888; font-size: 0.82rem; line-height: 1.5; margin: 8px 0 10px; }
    .sw-filename-input { width: 100%; padding: 10px 11px; border-radius: 6px; border: 1px solid #4b4b4b; background: #181818; color: white; font-size: 0.92rem; outline: none; }
    .sw-filename-input:focus { border-color: #777; }
    .sw-record-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px; }
    .sw-record-actions button { flex: 1; min-width: 120px; padding: 11px 13px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; }
    .sw-btn-copy { background: #566573; color: white; }
    .sw-btn-file { background: #2c3e50; color: white; }


    /* =========================================
       バータイマー用スタイル
       ========================================= */
    #app-bartimer .status-btn.active-lock { color: var(--text-color); border-color: var(--bt-accent); }
    #app-bartimer .indicator-dot.active { background-color: var(--bt-accent); box-shadow: 0 0 8px var(--bt-accent); }

    .bt-header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: #888; }
    .bt-countdown { font-size: 5rem; font-weight: bold; font-variant-numeric: tabular-nums; margin: 10px 0 4px; color: white; }
    .bt-countdown-caption { font-size: 0.95rem; color: #888; margin-bottom: 18px; }

    .bt-status { width: 100%; max-width: 600px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .bt-status-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 14px; min-width: 0; }
    .bt-status-label { font-size: 0.8rem; color: #888; margin-bottom: 5px; font-weight: bold; }
    .bt-status-item { font-size: 1.25rem; color: white; font-weight: bold; overflow-wrap: anywhere; }
    .bt-status-time { font-family: monospace; color: #aaa; font-size: 1rem; margin-top: 4px; }
    .bt-status-card.current { border-color: #555; }
    .bt-status-card.next { border-color: var(--bt-accent); box-shadow: 0 0 0 1px rgba(231,76,60,0.15); }
    .bt-status-card.next .bt-status-label,
    .bt-status-card.next .bt-status-item,
    .bt-status-card.next .bt-status-time { color: var(--bt-accent); }
    .bt-status-message { grid-column: 1 / -1; color: #aaa; text-align: center; padding: 8px 0 0; font-size: 0.95rem; min-height: 1.4em; }

    .bt-progress-container { width: 100%; max-width: 600px; height: 40px; background: #333; border-radius: 20px; overflow: hidden; margin-bottom: 30px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
    #bt-progress-bar { width: 0%; height: 100%; background: var(--bt-accent); transition: width 0.25s linear; }

    .bt-settings { width: 100%; max-width: 600px; background: #222; padding: 18px; border-radius: 10px; }
    .bt-settings button { padding: 11px 13px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; font-size: 14px; }
    .bt-settings button:hover { opacity: 0.84; }
    .bt-settings button:active { transform: scale(0.98); }
    .bt-start-btn { background: #27ae60; width: 100%; font-size: 1.45rem !important; padding: 14px !important; color: white; margin-bottom: 18px; }

    .bt-section { padding-top: 16px; margin-top: 16px; border-top: 1px solid #3a3a3a; }
    .bt-section:first-of-type { padding-top: 0; margin-top: 0; border-top: 0; }
    .bt-section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 9px; }
    .bt-section-title { margin: 0; color: #ddd; font-size: 1rem; }
    .bt-section-note { color: #777; font-size: 0.78rem; }

    /* 閲覧専用の予定一覧 */
    .bt-schedule-list { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; border: 1px solid #373737; border-radius: 7px; background: #191919; }
    .bt-schedule-row { display: grid; grid-template-columns: 68px minmax(0,1fr); gap: 9px; align-items: center; padding: 7px 10px; border-bottom: 1px solid #303030; border-left: 3px solid transparent; font-size: 0.92rem; }
    .bt-schedule-row:last-child { border-bottom: 0; }
    .bt-schedule-time { font-family: monospace; font-variant-numeric: tabular-nums; color: #aaa; }
    .bt-schedule-memo { color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bt-schedule-row.current { border-left-color: #666; background: rgba(255,255,255,0.025); }
    .bt-schedule-row.next { border-left-color: var(--bt-accent); background: rgba(231,76,60,0.16); }
    .bt-schedule-row.next .bt-schedule-time,
    .bt-schedule-row.next .bt-schedule-memo { color: var(--bt-accent); font-weight: bold; }
    .bt-schedule-empty { padding: 14px; color: #777; text-align: center; font-size: 0.9rem; }

    /* テキストが唯一の編集面 */
    .bt-text-help { color: #999; font-size: 0.84rem; line-height: 1.55; margin-bottom: 8px; }
    .bt-textarea { width: 100%; min-height: 165px; resize: vertical; padding: 12px; border-radius: 7px; border: 1px solid #555; background: #151515; color: white; font: 15px/1.55 monospace; outline: none; }
    .bt-textarea:focus { border-color: #777; }
    .bt-editor-state { min-height: 1.35em; margin-top: 6px; color: #777; font-size: 0.8rem; }
    .bt-editor-state.dirty { color: #f0ad4e; }
    .bt-editor-state.error { color: #ff7777; }
    .bt-editor-state.ok { color: #8bc79d; }

    .bt-button-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px; }
    .bt-button-row > button { flex: 1; min-width: 110px; }
    .bt-btn-apply { background: #2980b9; color: white; }
    .bt-btn-undo { background: #8a6d1d; color: white; }
    .bt-btn-copy { background: #566573; color: white; }
    .bt-btn-file { background: #2c3e50; color: white; }
    .bt-filename-input { width: 100%; padding: 10px 11px; border-radius: 6px; border: 1px solid #4b4b4b; background: #181818; color: white; font-size: 0.92rem; outline: none; }
    .bt-filename-input:focus { border-color: #777; }
    .bt-btn-action { background: #3498db; color: white; }
    .bt-btn-rel { background: #8e44ad; color: white; }
    .bt-btn-shift-minus { background: #b96d18; color: white; }
    .bt-btn-shift-plus { background: #b94b22; color: white; }
    .bt-btn-clear { background: transparent; color: #d88; border: 1px solid #744 !important; }

    .bt-quick-row { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1.2fr); gap: 8px; align-items: center; margin-top: 8px; }
    .bt-quick-row.two { grid-template-columns: auto minmax(0,1fr) minmax(0,1fr); }
    .bt-rel-time-input { width: 64px; padding: 10px 8px; border-radius: 6px; border: 1px solid #4b4b4b; font-size: 15px; background: #181818; color: white; text-align: center; }
    .bt-quick-label { color: #aaa; font-size: 0.86rem; white-space: nowrap; }

    @media (max-width: 600px) {
        #sw-time-display, .bt-countdown { font-size: 3.5rem; }
        .tab-btn { font-size: 0.9rem; padding: 10px; }
        .bt-status { grid-template-columns: 1fr; }
        .bt-status-message { grid-column: 1; }
        .bt-settings { padding: 14px; }
        .bt-quick-row, .bt-quick-row.two { grid-template-columns: auto 1fr 1fr; }
        .bt-quick-row .bt-btn-action { grid-column: 1 / -1; }
        .bt-schedule-list { max-height: 220px; }
    }
</style>
</head>
<body>

    <div class="tab-bar">
        <button class="tab-btn active" data-target="app-stopwatch">記録ストップウォッチ</button>
        <button class="tab-btn" data-target="app-bartimer">進行バータイマー</button>
    </div>

    <div id="app-stopwatch" class="app-container active">
        <div id="sw-status-bar">
            <button id="sw-btn-wakelock" class="status-btn" title="クリックで消灯防止をON/OFF">
                <div id="sw-wake-lock-dot" class="indicator-dot"></div>
                <span>消灯防止</span>
            </button>
            <div id="sw-currentTime" style="color:#888;">現在時刻: --:--:--</div>
            <div class="sw-base-time-container">
                起点時刻: <input type="time" id="sw-base-time-input" step="1" disabled title="ここを変更するとタイマーの経過時間が連動してズレます">
            </div>
        </div>

        <div id="sw-time-display">00:00:00</div>

        <div class="sw-controls">
            <button id="sw-btn-start" class="primary">開始</button>
            <button id="sw-btn-lap">ラップ記録</button>
            <button id="sw-btn-reset" class="danger">リセット</button>
        </div>

        <div class="sw-record-container">
            <div class="sw-record-header">
                <h3 style="margin:0;">記録テキスト</h3>
                <span class="sw-record-note">自動保存</span>
            </div>
            <textarea id="sw-record-text" class="sw-record-textarea" spellcheck="false" placeholder="00:00:00  11:30:00  開始\n00:12:34  11:42:34  メモ\n00:15:00  11:45:00  停止"></textarea>
            <div class="sw-record-help">開始・停止・ラップ記録を押すと「経過時間  現在時刻  種別」を追記します。メモは必要なときにテキスト欄へ直接入力できます。</div>
            <input type="text" id="sw-filename-input" class="sw-filename-input" placeholder="ファイル名（例：本番記録）" maxlength="120" aria-label="保存するテキストファイル名">
            <div class="sw-record-actions">
                <button type="button" class="sw-btn-copy" id="sw-btn-copy">コピー</button>
                <button type="button" class="sw-btn-file" id="sw-btn-export">TXT保存</button>
            </div>
        </div>
    </div>

    <div id="app-bartimer" class="app-container">
        <div class="bt-header">
            <button id="bt-btn-wakelock" class="status-btn" title="クリックで消灯防止をON/OFF">
                <div id="bt-wake-lock-dot" class="indicator-dot"></div>
                <span>消灯防止</span>
            </button>
            <div id="bt-currentTime">現在時刻: --:--:--</div>
        </div>

        <div class="bt-countdown" id="bt-countdown">00:00</div>
        <div class="bt-countdown-caption" id="bt-countdown-caption">次の予定まで</div>
        <div class="bt-status" id="bt-status">
            <div class="bt-status-card current">
                <div class="bt-status-label">現在</div>
                <div class="bt-status-item" id="bt-current-item">設定してください</div>
                <div class="bt-status-time" id="bt-current-item-time">--:--</div>
            </div>
            <div class="bt-status-card next">
                <div class="bt-status-label">次</div>
                <div class="bt-status-item" id="bt-next-item">--</div>
                <div class="bt-status-time" id="bt-next-item-time">--:--</div>
            </div>
            <div class="bt-status-message" id="bt-status-message"></div>
        </div>

        <div class="bt-progress-container">
            <div id="bt-progress-bar"></div>
        </div>

        <div class="bt-settings">
            <button class="bt-start-btn" id="bt-mainBtn">スタート</button>

            <section class="bt-section">
                <div class="bt-section-head">
                    <h3 class="bt-section-title">予定一覧</h3>
                    <span class="bt-section-note">閲覧専用</span>
                </div>
                <ul id="bt-schedule-list" class="bt-schedule-list">
                    <li class="bt-schedule-empty">予定がありません</li>
                </ul>
            </section>

            <section class="bt-section">
                <div class="bt-section-head">
                    <h3 class="bt-section-title">スケジュール編集</h3>
                    <span class="bt-section-note">テキストのみ</span>
                </div>
                <div class="bt-text-help">
                    1行1予定：<code>1230開場</code> / <code>1330開演</code><br>
                    同一日内で時刻順に入力してください。<code>12:30開場</code> も読み込めます。
                </div>
                <textarea id="bt-text-editor" class="bt-textarea" spellcheck="false" placeholder="1230開場&#10;1330開演&#10;1415休憩"></textarea>
                <div id="bt-editor-state" class="bt-editor-state">反映済み</div>
                <div class="bt-button-row">
                    <button type="button" class="bt-btn-apply" id="bt-btn-text-apply">編集内容を反映</button>
                    <button type="button" class="bt-btn-undo" id="bt-btn-undo" title="直前の反映・追加・シフトを取り消す">↩ 元に戻す</button>
                </div>
            </section>

            <section class="bt-section">
                <div class="bt-section-head">
                    <h3 class="bt-section-title">時刻操作</h3>
                    <span class="bt-section-note">編集欄にも反映</span>
                </div>
                <div class="bt-button-row">
                    <button type="button" class="bt-btn-action" id="bt-btn-start-now">現時刻を追加</button>
                </div>
                <div class="bt-quick-row">
                    <span class="bt-quick-label">現時刻から</span>
                    <input type="number" id="bt-nowRelMins" class="bt-rel-time-input" value="15" min="1" inputmode="numeric" aria-label="現時刻から何分後か">
                    <button type="button" class="bt-btn-rel" id="bt-btn-now-and-rel">分後を追加</button>
                </div>
                <div class="bt-quick-row two">
                    <input type="number" id="bt-shiftMins" class="bt-rel-time-input" value="1" min="1" inputmode="numeric" aria-label="一括シフトする分数">
                    <button type="button" class="bt-btn-shift-minus" id="bt-btn-shift-minus">分戻す</button>
                    <button type="button" class="bt-btn-shift-plus" id="bt-btn-shift-plus">分進める</button>
                </div>
            </section>

            <section class="bt-section">
                <div class="bt-section-head">
                    <h3 class="bt-section-title">テキスト入出力</h3>
                </div>
                <input type="text" id="bt-filename-input" class="bt-filename-input" placeholder="ファイル名（例：本番進行）" maxlength="120" aria-label="保存するテキストファイル名">
                <div class="bt-button-row">
                    <button type="button" class="bt-btn-copy" id="bt-btn-text-copy">コピー</button>
                    <button type="button" class="bt-btn-file" id="bt-btn-file-export">TXT保存</button>
                    <button type="button" class="bt-btn-file" id="bt-btn-file-import">TXT読込</button>
                    <input type="file" id="bt-file-input" accept=".txt,text/plain" style="display:none;">
                </div>
                <div class="bt-button-row">
                    <button type="button" class="bt-btn-clear" id="bt-btn-clear-all">予定を全消去</button>
                </div>
            </section>
        </div>
    </div>

<script>
// ==========================================
// 共通ロジック
// ==========================================
function safeStorageGet(key) {
    try { return localStorage.getItem(key); } catch (err) { return null; }
}
function safeStorageSet(key, value) {
    try { localStorage.setItem(key, value); return true; } catch (err) { return false; }
}
function safeStorageRemove(key) {
    try { localStorage.removeItem(key); } catch (err) {}
}

// タブ切り替え
const tabBtns = document.querySelectorAll('.tab-btn');
const allowedTabs = new Set(['app-stopwatch', 'app-bartimer']);
const savedTab = safeStorageGet('stageActiveTab');
if (savedTab && allowedTabs.has(savedTab)) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.app-container').forEach(c => c.classList.remove('active'));
    const targetBtn = Array.from(tabBtns).find(b => b.dataset.target === savedTab);
    const targetApp = document.getElementById(savedTab);
    if (targetBtn && targetApp) {
        targetBtn.classList.add('active');
        targetApp.classList.add('active');
    }
}
tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.app-container').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        const targetId = btn.dataset.target;
        const targetApp = document.getElementById(targetId);
        if (targetApp) targetApp.classList.add('active');
        safeStorageSet('stageActiveTab', targetId);
    });
});

// ==========================================
// アプリ1: ストップウォッチ（テキスト記録専用）
// ==========================================
(() => {
    const emptyState = () => ({ isRunning: false, startTime: 0, accumulatedTime: 0, baseShowTime: null, recordText: '' });
    let state = emptyState();
    let animationFrameId = null;
    let wakeLock = null;

    const els = {
        timeDisplay: document.getElementById('sw-time-display'),
        recordText: document.getElementById('sw-record-text'),
        filenameInput: document.getElementById('sw-filename-input'),
        btnCopy: document.getElementById('sw-btn-copy'),
        btnStart: document.getElementById('sw-btn-start'),
        baseTimeInput: document.getElementById('sw-base-time-input'),
        btnWakeLock: document.getElementById('sw-btn-wakelock'),
        wakeLockDot: document.getElementById('sw-wake-lock-dot'),
        btnLap: document.getElementById('sw-btn-lap'),
        btnReset: document.getElementById('sw-btn-reset'),
        btnExport: document.getElementById('sw-btn-export'),
        currentTime: document.getElementById('sw-currentTime')
    };

    function formatTime(ms) {
        const isNegative = ms < 0;
        const totalSeconds = Math.floor(Math.abs(ms) / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return `${isNegative ? '-' : ''}${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function formatRealTime(date = new Date()) {
        return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}:${String(date.getSeconds()).padStart(2, '0')}`;
    }

    function migrateLegacyLaps(laps) {
        if (!Array.isArray(laps)) return '';
        return laps
            .filter(l => l && typeof l === 'object')
            .map(l => {
                const elapsed = Number.isFinite(l.elapsed) ? formatTime(l.elapsed) : '00:00:00';
                const realTime = typeof l.realTime === 'string' ? l.realTime : '--:--:--';
                const memo = typeof l.memo === 'string' ? l.memo.trim() : '';
                return `${elapsed}  ${realTime}${memo ? `  ${memo}` : ''}`;
            })
            .join('\n');
    }

    function normalizeState(data) {
        if (!data || typeof data !== 'object' ||
            typeof data.isRunning !== 'boolean' ||
            !Number.isFinite(data.startTime) || !Number.isFinite(data.accumulatedTime) ||
            !(data.baseShowTime === null || Number.isFinite(data.baseShowTime))) {
            throw new Error('invalid state');
        }
        return {
            isRunning: data.isRunning,
            startTime: data.startTime,
            accumulatedTime: data.accumulatedTime,
            baseShowTime: data.baseShowTime,
            recordText: typeof data.recordText === 'string' ? data.recordText : migrateLegacyLaps(data.laps)
        };
    }

    function init() {
        const saved = safeStorageGet('stageTimerState');
        if (saved) {
            try {
                state = normalizeState(JSON.parse(saved));
            } catch (err) {
                state = emptyState();
                safeStorageRemove('stageTimerState');
                console.warn('ストップウォッチの保存データを初期化しました。', err);
            }
        }

        els.recordText.value = state.recordText;
        els.filenameInput.value = safeStorageGet('swRecordFilename') || '';
        updateBaseTimeDisplay();

        if (state.isRunning) {
            els.btnStart.textContent = '停止';
            els.btnStart.classList.remove('primary');
            updateTime();
            requestWakeLock(false);
        } else {
            renderTime(state.accumulatedTime);
        }
        updateRealTime();
        setInterval(updateRealTime, 1000);
    }

    function saveState() {
        if (!safeStorageSet('stageTimerState', JSON.stringify(state))) {
            console.warn('ストップウォッチの状態を保存できませんでした。');
        }
    }

    function updateRealTime() {
        els.currentTime.textContent = `現在時刻: ${new Date().toLocaleTimeString()}`;
    }

    function renderTime(ms) { els.timeDisplay.textContent = formatTime(ms); }

    function updateTime() {
        if (!state.isRunning) return;
        renderTime(state.accumulatedTime + (Date.now() - state.startTime));
        animationFrameId = requestAnimationFrame(updateTime);
    }

    function updateBaseTimeDisplay() {
        if (state.baseShowTime) {
            els.baseTimeInput.value = formatRealTime(new Date(state.baseShowTime));
            els.baseTimeInput.disabled = false;
        } else {
            els.baseTimeInput.value = '';
            els.baseTimeInput.disabled = true;
        }
    }

    els.baseTimeInput.addEventListener('change', e => {
        if (!state.baseShowTime || !e.target.value) return;
        const [hours, minutes, seconds] = e.target.value.split(':').map(Number);
        if (![hours, minutes, seconds || 0].every(Number.isFinite)) return;
        const oldDate = new Date(state.baseShowTime);
        const newTimestamp = new Date(oldDate.getFullYear(), oldDate.getMonth(), oldDate.getDate(), hours, minutes, seconds || 0).getTime();
        state.accumulatedTime += state.baseShowTime - newTimestamp;
        state.baseShowTime = newTimestamp;
        if (!state.isRunning) renderTime(state.accumulatedTime);
        saveState();
    });

    function setWakeLockLabel(text, title) {
        const label = els.btnWakeLock.querySelector('span');
        if (label) label.textContent = text;
        els.btnWakeLock.title = title;
    }

    async function requestWakeLock(showFailure = true) {
        if (wakeLock !== null) return;
        if (!('wakeLock' in navigator)) {
            setWakeLockLabel('消灯防止: 非対応', 'このブラウザでは画面の消灯防止を利用できません');
            if (showFailure) alert('このブラウザでは消灯防止機能を利用できません。');
            return;
        }
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            els.wakeLockDot.classList.add('active');
            els.btnWakeLock.classList.add('active-lock');
            setWakeLockLabel('消灯防止 ON', 'クリックで消灯防止をOFF');
            wakeLock.addEventListener('release', () => {
                els.wakeLockDot.classList.remove('active');
                els.btnWakeLock.classList.remove('active-lock');
                wakeLock = null;
                setWakeLockLabel('消灯防止', 'クリックで消灯防止をON/OFF');
            });
        } catch (err) {
            wakeLock = null;
            setWakeLockLabel('消灯防止: 失敗', '消灯防止を有効にできませんでした');
            if (showFailure) alert('消灯防止を有効にできませんでした。端末やブラウザの設定を確認してください。');
        }
    }

    async function releaseWakeLock() {
        if (wakeLock !== null) {
            try { await wakeLock.release(); } catch (err) {}
            wakeLock = null;
        }
    }

    els.btnWakeLock.addEventListener('click', () => wakeLock !== null ? releaseWakeLock() : requestWakeLock(true));
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && state.isRunning) requestWakeLock(false);
    });

    function syncRecordText() {
        state.recordText = els.recordText.value;
        saveState();
    }

    function appendRecordLine(label, elapsedMs, date = new Date(), trailingMemoSpace = false) {
        // 記録追加でページやテキスト欄のスクロール位置を動かさない。
        const pageX = window.scrollX;
        const pageY = window.scrollY;
        const textScrollTop = els.recordText.scrollTop;
        const textScrollLeft = els.recordText.scrollLeft;
        const line = `${formatTime(elapsedMs)}  ${formatRealTime(date)}${label ? `  ${label}` : ''}${trailingMemoSpace ? '  ' : ''}`;
        const existing = els.recordText.value;
        const separator = existing.length === 0 || existing.endsWith('\n') ? '' : '\n';
        els.recordText.value = `${existing}${separator}${line}`;
        els.recordText.scrollTop = textScrollTop;
        els.recordText.scrollLeft = textScrollLeft;
        window.scrollTo(pageX, pageY);
        syncRecordText();
    }

    els.btnStart.addEventListener('click', () => {
        const now = Date.now();
        const nowDate = new Date(now);
        if (state.isRunning) {
            state.accumulatedTime += now - state.startTime;
            state.isRunning = false;
            els.btnStart.textContent = '開始';
            els.btnStart.classList.add('primary');
            cancelAnimationFrame(animationFrameId);
            releaseWakeLock();
            appendRecordLine('停止', state.accumulatedTime, nowDate);
        } else {
            if (!state.baseShowTime && state.accumulatedTime === 0) {
                state.baseShowTime = now;
                updateBaseTimeDisplay();
            }
            state.startTime = now;
            state.isRunning = true;
            els.btnStart.textContent = '停止';
            els.btnStart.classList.remove('primary');
            requestWakeLock(false);
            updateTime();
            appendRecordLine('開始', state.accumulatedTime, nowDate);
        }
        saveState();
    });

    els.recordText.addEventListener('input', syncRecordText);
    els.filenameInput.addEventListener('input', () => safeStorageSet('swRecordFilename', els.filenameInput.value));

    els.btnLap.addEventListener('click', () => {
        const now = Date.now();
        const elapsedMs = state.isRunning
            ? state.accumulatedTime + (now - state.startTime)
            : state.accumulatedTime;
        appendRecordLine('', elapsedMs, new Date(now), true);
    });

    els.btnReset.addEventListener('click', () => {
        if (!confirm('タイマーと記録テキストをすべてリセットしますか？')) return;
        state = emptyState();
        updateBaseTimeDisplay();
        els.btnStart.textContent = '開始';
        els.btnStart.classList.add('primary');
        cancelAnimationFrame(animationFrameId);
        renderTime(0);
        els.recordText.value = '';
        saveState();
        releaseWakeLock();
    });

    async function copyRecordText() {
        const text = els.recordText.value;
        if (!text) return alert('コピーする記録がありません。');
        try {
            await navigator.clipboard.writeText(text);
        } catch (err) {
            els.recordText.focus();
            els.recordText.select();
            const ok = document.execCommand('copy');
            const end = els.recordText.value.length;
            els.recordText.setSelectionRange(end, end);
            if (!ok) return alert('コピーできませんでした。');
        }
        const original = els.btnCopy.textContent;
        els.btnCopy.textContent = 'コピーしました';
        setTimeout(() => { els.btnCopy.textContent = original; }, 1200);
    }

    els.btnCopy.addEventListener('click', copyRecordText);

    function sanitizedFilename() {
        let name = els.filenameInput.value.trim().replace(/[<>:"/\\|?*\x00-\x1F]/g, '_').replace(/[. ]+$/g, '');
        if (!name) {
            const now = new Date();
            const date = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
            const time = `${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}`;
            name = `stage_record_${date}_${time}`;
        }
        if (!name.toLowerCase().endsWith('.txt')) name += '.txt';
        return name;
    }

    els.btnExport.addEventListener('click', () => {
        const text = els.recordText.value;
        if (!text) return alert('保存する記録がありません。');
        const url = URL.createObjectURL(new Blob(['\uFEFF', text], { type: 'text/plain;charset=utf-8' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = sanitizedFilename();
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
    });

    init();
})();

// ==========================================
// アプリ2: 進行バータイマー（同一日・テキスト編集専用）
// ==========================================
(() => {
    const els = {
        scheduleList: document.getElementById('bt-schedule-list'),
        btnWakeLock: document.getElementById('bt-btn-wakelock'),
        wakeLockDot: document.getElementById('bt-wake-lock-dot'),
        currentTime: document.getElementById('bt-currentTime'),
        statusMessage: document.getElementById('bt-status-message'),
        currentItem: document.getElementById('bt-current-item'),
        currentItemTime: document.getElementById('bt-current-item-time'),
        nextItem: document.getElementById('bt-next-item'),
        nextItemTime: document.getElementById('bt-next-item-time'),
        countdown: document.getElementById('bt-countdown'),
        countdownCaption: document.getElementById('bt-countdown-caption'),
        progressBar: document.getElementById('bt-progress-bar'),
        mainBtn: document.getElementById('bt-mainBtn'),
        btnStartNow: document.getElementById('bt-btn-start-now'),
        btnClearAll: document.getElementById('bt-btn-clear-all'),
        btnNowAndRel: document.getElementById('bt-btn-now-and-rel'),
        btnUndo: document.getElementById('bt-btn-undo'),
        nowRelMinsInput: document.getElementById('bt-nowRelMins'),
        shiftMinsInput: document.getElementById('bt-shiftMins'),
        btnShiftPlus: document.getElementById('bt-btn-shift-plus'),
        btnShiftMinus: document.getElementById('bt-btn-shift-minus'),
        btnFileExport: document.getElementById('bt-btn-file-export'),
        btnFileImport: document.getElementById('bt-btn-file-import'),
        fileInput: document.getElementById('bt-file-input'),
        filenameInput: document.getElementById('bt-filename-input'),
        textEditor: document.getElementById('bt-text-editor'),
        editorState: document.getElementById('bt-editor-state'),
        btnTextApply: document.getElementById('bt-btn-text-apply'),
        btnTextCopy: document.getElementById('bt-btn-text-copy')
    };

    let scheduleData = [];
    let isRunning = false;
    let wakeLock = null;
    let undoBuffer = null;

    const numericSettingKeys = {
        shift: 'barTimerShiftMins',
        nowRel: 'barTimerNowRelMins'
    };
    const filenameStorageKey = 'barTimerFilename';

    function cloneSchedule(data) {
        return data.map(item => ({ time: item.time, memo: item.memo }));
    }

    function parseTimeToMinutes(value) {
        const match = /^([01]\d|2[0-3]):([0-5]\d)$/.exec(String(value || '').trim());
        if (!match) return null;
        return Number(match[1]) * 60 + Number(match[2]);
    }

    function minutesToTime(minutes) {
        if (!Number.isInteger(minutes) || minutes < 0 || minutes >= 24 * 60) return null;
        return `${String(Math.floor(minutes / 60)).padStart(2, '0')}:${String(minutes % 60).padStart(2, '0')}`;
    }

    function normalizeStoredSchedule(raw) {
        if (!Array.isArray(raw) || raw.length > 500) return null;
        const normalized = [];
        let previous = -1;
        for (const item of raw) {
            const source = typeof item === 'string' ? { time: item, memo: '' } : item;
            if (!source || typeof source !== 'object') return null;
            const time = String(source.time || '').trim();
            const minutes = parseTimeToMinutes(time);
            if (minutes === null || minutes <= previous) return null;
            const memo = typeof source.memo === 'string' ? source.memo.slice(0, 5000) : '';
            normalized.push({ time, memo });
            previous = minutes;
        }
        return normalized;
    }

    function scheduleToPlainText(data = scheduleData) {
        return data.map(item => `${item.time.replace(':', '')}${item.memo || ''}`).join('\n');
    }

    function parsePlainTextSchedule(text, { allowEmpty = false } = {}) {
        const source = String(text || '').replace(/^\uFEFF/, '');
        const lines = source.split(/\r?\n/);
        const result = [];
        let previous = -1;

        for (let i = 0; i < lines.length; i++) {
            const rawLine = lines[i];
            if (!rawLine.trim()) continue;
            if (result.length >= 500) return { ok: false, message: '予定は500件までです。' };

            const match = rawLine.match(/^\s*([01]\d|2[0-3]):?([0-5]\d)(.*)$/);
            if (!match) return { ok: false, message: `${i + 1}行目の形式が正しくありません。例：1230開場` };

            const minutes = Number(match[1]) * 60 + Number(match[2]);
            if (minutes <= previous) {
                return { ok: false, message: `${i + 1}行目の時刻が前の行以前です。同一日内で昇順にしてください。` };
            }
            const memo = match[3].replace(/^[ \t　]+/, '');
            if (memo.length > 5000) return { ok: false, message: `${i + 1}行目の項目名が長すぎます。` };
            result.push({ time: `${match[1]}:${match[2]}`, memo });
            previous = minutes;
        }

        if (result.length === 0 && !allowEmpty) return { ok: false, message: '予定を1件以上入力してください。' };
        return { ok: true, data: result };
    }

    function setEditorState(message, kind = '') {
        els.editorState.textContent = message;
        els.editorState.className = `bt-editor-state${kind ? ` ${kind}` : ''}`;
    }

    function saveData() {
        if (!safeStorageSet('barTimerSchedule', JSON.stringify(scheduleData))) {
            els.statusMessage.textContent = '予定を端末に保存できませんでした。';
        }
    }

    function saveUndoState(data = scheduleData) {
        undoBuffer = cloneSchedule(data);
    }

    function renderScheduleList() {
        els.scheduleList.replaceChildren();
        if (scheduleData.length === 0) {
            const empty = document.createElement('li');
            empty.className = 'bt-schedule-empty';
            empty.textContent = '予定がありません';
            els.scheduleList.appendChild(empty);
            return;
        }

        scheduleData.forEach((item, index) => {
            const row = document.createElement('li');
            row.className = 'bt-schedule-row';
            row.dataset.index = String(index);

            const time = document.createElement('span');
            time.className = 'bt-schedule-time';
            time.textContent = item.time;

            const memo = document.createElement('span');
            memo.className = 'bt-schedule-memo';
            memo.textContent = item.memo || '（項目名なし）';
            memo.title = item.memo || '（項目名なし）';

            row.append(time, memo);
            els.scheduleList.appendChild(row);
        });
    }

    function clearScheduleHighlights() {
        els.scheduleList.querySelectorAll('.bt-schedule-row').forEach(row => row.classList.remove('current', 'next'));
    }

    function highlightSchedule(currentIndex, nextIndex) {
        clearScheduleHighlights();
        const rows = els.scheduleList.querySelectorAll('.bt-schedule-row');
        if (Number.isInteger(currentIndex) && rows[currentIndex]) rows[currentIndex].classList.add('current');
        if (Number.isInteger(nextIndex) && rows[nextIndex]) {
            rows[nextIndex].classList.add('next');
        }
    }

    function setSchedule(data, { syncEditor = true, persist = true } = {}) {
        scheduleData = cloneSchedule(data);
        if (persist) saveData();
        renderScheduleList();
        if (syncEditor) {
            els.textEditor.value = scheduleToPlainText();
            setEditorState('反映済み', 'ok');
        }
        if (isRunning) updateTime();
    }

    function loadData() {
        const saved = safeStorageGet('barTimerSchedule');
        if (!saved) {
            setSchedule([], { persist: false });
            return;
        }
        try {
            const parsed = normalizeStoredSchedule(JSON.parse(saved));
            if (!parsed) throw new Error('invalid schedule');
            setSchedule(parsed, { persist: false });
        } catch (err) {
            safeStorageRemove('barTimerSchedule');
            setSchedule([], { persist: false });
            els.statusMessage.textContent = '保存データを読み込めなかったため、予定を空にしました。';
        }
    }

    function restoreNumericSettings() {
        const settings = [
            [els.shiftMinsInput, numericSettingKeys.shift, '1'],
            [els.nowRelMinsInput, numericSettingKeys.nowRel, '15']
        ];
        settings.forEach(([input, key, fallback]) => {
            const saved = safeStorageGet(key);
            input.value = saved !== null && Number.isFinite(Number(saved)) && Number(saved) >= 1 ? String(Math.floor(Number(saved))) : fallback;
            const persist = () => {
                const value = Math.floor(Number(input.value));
                if (Number.isFinite(value) && value >= 1) safeStorageSet(key, String(value));
            };
            input.addEventListener('change', persist);
            input.addEventListener('blur', persist);
        });
    }

    function restoreFilenameSetting() {
        const saved = safeStorageGet(filenameStorageKey);
        if (saved) els.filenameInput.value = saved;
        const persist = () => safeStorageSet(filenameStorageKey, els.filenameInput.value.trim());
        els.filenameInput.addEventListener('input', persist);
        els.filenameInput.addEventListener('change', persist);
    }

    function makeExportFilename() {
        let name = els.filenameInput.value.trim().replace(/\.txt$/i, '');
        name = name.replace(/[\\/:*?"<>|\x00-\x1F]/g, '_').replace(/[. ]+$/g, '').trim();
        if (!name) {
            const now = new Date();
            const stamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}`;
            name = `stage_schedule_${stamp}`;
        }
        return `${name}.txt`;
    }

    function updateBarTimerClock() {
        els.currentTime.textContent = `現在時刻: ${new Date().toLocaleTimeString()}`;
    }
    updateBarTimerClock();
    setInterval(updateBarTimerClock, 1000);

    function setWakeLockLabel(text, title) {
        const label = els.btnWakeLock.querySelector('span');
        if (label) label.textContent = text;
        els.btnWakeLock.title = title;
    }

    async function requestWakeLock(showFailure = true) {
        if (wakeLock !== null) return;
        if (!('wakeLock' in navigator)) {
            setWakeLockLabel('消灯防止: 非対応', 'このブラウザでは画面の消灯防止を利用できません');
            if (showFailure) alert('このブラウザでは消灯防止機能を利用できません。');
            return;
        }
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            els.wakeLockDot.classList.add('active');
            els.btnWakeLock.classList.add('active-lock');
            setWakeLockLabel('消灯防止 ON', 'クリックで消灯防止をOFF');
            wakeLock.addEventListener('release', () => {
                els.wakeLockDot.classList.remove('active');
                els.btnWakeLock.classList.remove('active-lock');
                wakeLock = null;
                setWakeLockLabel('消灯防止', 'クリックで消灯防止をON/OFF');
            });
        } catch (err) {
            wakeLock = null;
            setWakeLockLabel('消灯防止: 失敗', '消灯防止を有効にできませんでした');
            if (showFailure) alert('消灯防止を有効にできませんでした。端末やブラウザの設定を確認してください。');
        }
    }

    async function releaseWakeLock() {
        if (wakeLock !== null) {
            try { await wakeLock.release(); } catch (err) {}
            wakeLock = null;
        }
    }

    els.btnWakeLock.addEventListener('click', () => wakeLock !== null ? releaseWakeLock() : requestWakeLock(true));
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && isRunning) requestWakeLock(false);
    });

    function applyEditor({ saveUndo = true, showMessage = false } = {}) {
        const parsed = parsePlainTextSchedule(els.textEditor.value, { allowEmpty: true });
        if (!parsed.ok) {
            setEditorState(parsed.message, 'error');
            if (showMessage) alert(parsed.message);
            return false;
        }
        if (saveUndo) saveUndoState();
        setSchedule(parsed.data);
        els.statusMessage.textContent = '';
        return true;
    }

    function editorDataForOperation() {
        const parsed = parsePlainTextSchedule(els.textEditor.value, { allowEmpty: true });
        if (!parsed.ok) {
            setEditorState(parsed.message, 'error');
            alert(parsed.message);
            return null;
        }
        return parsed.data;
    }

    function insertChronologically(data, timeValue, memoValue) {
        const targetMinutes = parseTimeToMinutes(timeValue);
        if (targetMinutes === null) return { ok: false, message: '追加する時刻が正しくありません。' };
        const result = cloneSchedule(data);
        const duplicate = result.some(item => parseTimeToMinutes(item.time) === targetMinutes);
        if (duplicate) return { ok: false, message: `${timeValue} はすでに予定にあります。` };
        const index = result.findIndex(item => parseTimeToMinutes(item.time) > targetMinutes);
        const item = { time: timeValue, memo: memoValue };
        if (index === -1) result.push(item);
        else result.splice(index, 0, item);
        return { ok: true, data: result };
    }

    els.textEditor.addEventListener('input', () => {
        const canonical = scheduleToPlainText();
        if (els.textEditor.value === canonical) setEditorState('反映済み', 'ok');
        else setEditorState('未反映の編集があります', 'dirty');
    });

    els.btnTextApply.addEventListener('click', () => {
        if (applyEditor({ saveUndo: true, showMessage: true })) setEditorState('反映しました', 'ok');
    });

    els.btnUndo.addEventListener('click', () => {
        if (!undoBuffer) return alert('取り消せる操作がありません。');
        const current = cloneSchedule(scheduleData);
        setSchedule(undoBuffer);
        undoBuffer = current;
        els.statusMessage.textContent = '';
    });

    els.btnStartNow.addEventListener('click', () => {
        const base = editorDataForOperation();
        if (!base) return;
        const now = new Date();
        const timeValue = minutesToTime(now.getHours() * 60 + now.getMinutes());
        const inserted = insertChronologically(base, timeValue, '現時刻');
        if (!inserted.ok) return alert(inserted.message);
        saveUndoState(base);
        setSchedule(inserted.data);
    });

    els.btnNowAndRel.addEventListener('click', () => {
        const min = Math.floor(Number(els.nowRelMinsInput.value));
        if (!Number.isFinite(min) || min <= 0) return alert('追加する分数は1以上にしてください。');
        const now = new Date();
        const futureMinutes = now.getHours() * 60 + now.getMinutes() + min;
        if (futureMinutes >= 24 * 60) return alert('日付を跨ぐ時刻は追加できません。');
        const base = editorDataForOperation();
        if (!base) return;
        const inserted = insertChronologically(base, minutesToTime(futureMinutes), `${min}分後`);
        if (!inserted.ok) return alert(inserted.message);
        saveUndoState(base);
        setSchedule(inserted.data);
    });

    function shiftAllTimes(delta) {
        if (!Number.isInteger(delta) || delta === 0) return;
        const base = editorDataForOperation();
        if (!base) return;
        if (base.length === 0) return alert('シフトする予定がありません。');
        const shifted = [];
        for (const item of base) {
            const current = parseTimeToMinutes(item.time);
            const next = current + delta;
            if (next < 0 || next >= 24 * 60) return alert('日付を跨ぐ一括シフトはできません。');
            shifted.push({ time: minutesToTime(next), memo: item.memo });
        }
        saveUndoState(base);
        setSchedule(shifted);
    }

    els.btnShiftPlus.addEventListener('click', () => shiftAllTimes(Math.floor(Number(els.shiftMinsInput.value)) || 0));
    els.btnShiftMinus.addEventListener('click', () => shiftAllTimes(-(Math.floor(Number(els.shiftMinsInput.value)) || 0)));

    els.btnClearAll.addEventListener('click', () => {
        if (!confirm('予定をすべて消去しますか？')) return;
        const base = editorDataForOperation();
        if (!base) return;
        saveUndoState(base);
        setSchedule([]);
        if (isRunning) setTimerState(false, { commitEditor: false });
        renderIdle();
    });

    async function copyTextToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return;
        }
        els.textEditor.focus();
        els.textEditor.select();
        if (!document.execCommand('copy')) throw new Error('copy failed');
    }

    function getValidatedEditorText() {
        const parsed = parsePlainTextSchedule(els.textEditor.value, { allowEmpty: false });
        if (!parsed.ok) {
            setEditorState(parsed.message, 'error');
            alert(parsed.message);
            return null;
        }
        return { text: scheduleToPlainText(parsed.data), data: parsed.data };
    }

    els.btnTextCopy.addEventListener('click', async () => {
        const validated = getValidatedEditorText();
        if (!validated) return;
        try {
            await copyTextToClipboard(validated.text);
            const original = els.btnTextCopy.textContent;
            els.btnTextCopy.textContent = 'コピー済み';
            setTimeout(() => { els.btnTextCopy.textContent = original; }, 1200);
        } catch (err) {
            alert('自動コピーできませんでした。テキスト欄を選択してコピーしてください。');
        }
    });

    els.btnFileExport.addEventListener('click', () => {
        const validated = getValidatedEditorText();
        if (!validated) return;
        const url = URL.createObjectURL(new Blob(['\uFEFF', validated.text], { type: 'text/plain;charset=utf-8' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = makeExportFilename();
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
    });

    els.btnFileImport.addEventListener('click', () => els.fileInput.click());
    els.fileInput.addEventListener('change', e => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
            alert('ファイルが大きすぎます。2MB以下のテキストファイルを使用してください。');
            e.target.value = '';
            return;
        }
        const reader = new FileReader();
        reader.onload = event => {
            const parsed = parsePlainTextSchedule(String(event.target.result || ''), { allowEmpty: false });
            if (!parsed.ok) {
                setEditorState(parsed.message, 'error');
                alert(parsed.message);
                return;
            }
            saveUndoState();
            setSchedule(parsed.data);
            const importedBaseName = file.name.replace(/\.txt$/i, '');
            if (importedBaseName) {
                els.filenameInput.value = importedBaseName;
                safeStorageSet(filenameStorageKey, importedBaseName);
            }
            els.statusMessage.textContent = '';
        };
        reader.onerror = () => alert('テキストファイルの読み込みに失敗しました。');
        reader.readAsText(file, 'UTF-8');
        e.target.value = '';
    });

    function validateScheduleForTimer() {
        if (scheduleData.length < 2) return { ok: false, message: 'タイマーには2つ以上の予定が必要です。' };
        return { ok: true, message: '' };
    }

    function renderIdle() {
        els.currentItem.textContent = '設定してください';
        els.currentItemTime.textContent = '--:--';
        els.nextItem.textContent = '--';
        els.nextItemTime.textContent = '--:--';
        els.countdown.textContent = '00:00';
        els.countdownCaption.textContent = '次の予定まで';
        els.progressBar.style.width = '0%';
        clearScheduleHighlights();
    }

    function setTimerState(nextState, { commitEditor = true } = {}) {
        if (nextState && commitEditor) {
            const parsed = parsePlainTextSchedule(els.textEditor.value, { allowEmpty: true });
            if (!parsed.ok) {
                setEditorState(parsed.message, 'error');
                els.statusMessage.textContent = parsed.message;
                return;
            }
            const changed = scheduleToPlainText(parsed.data) !== scheduleToPlainText(scheduleData);
            if (changed) {
                saveUndoState();
                setSchedule(parsed.data);
            }
        }

        if (nextState) {
            const validation = validateScheduleForTimer();
            if (!validation.ok) {
                els.statusMessage.textContent = validation.message;
                isRunning = false;
                safeStorageSet('barTimerIsRunning', 'false');
                els.mainBtn.textContent = 'スタート';
                els.mainBtn.style.background = '#27ae60';
                return;
            }
            els.statusMessage.textContent = '';
        }

        isRunning = nextState;
        safeStorageSet('barTimerIsRunning', String(isRunning));
        els.mainBtn.textContent = isRunning ? 'ストップ' : 'スタート';
        els.mainBtn.style.background = isRunning ? '#e67e22' : '#27ae60';
        if (isRunning) {
            requestWakeLock(false);
            updateTime();
        } else {
            releaseWakeLock();
        }
    }

    els.mainBtn.addEventListener('click', () => setTimerState(!isRunning));

    function updateTime() {
        if (!isRunning) return;
        const validation = validateScheduleForTimer();
        if (!validation.ok) {
            els.statusMessage.textContent = validation.message;
            setTimerState(false, { commitEditor: false });
            return;
        }

        const schedule = scheduleData.map(item => ({ ...item, minutes: parseTimeToMinutes(item.time) }));
        const now = new Date();
        const nowSecondsOfDay = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000;
        const nowMinutes = nowSecondsOfDay / 60;

        let currentIndex = -1;
        for (let i = 0; i < schedule.length - 1; i++) {
            if (nowMinutes >= schedule[i].minutes && nowMinutes < schedule[i + 1].minutes) {
                currentIndex = i;
                break;
            }
        }

        if (currentIndex !== -1) {
            const startSec = schedule[currentIndex].minutes * 60;
            const endSec = schedule[currentIndex + 1].minutes * 60;
            const remainingSec = Math.max(0, endSec - nowSecondsOfDay);
            const durationSec = Math.max(1, endSec - startSec);
            const currentMemo = schedule[currentIndex].memo || '（項目名なし）';
            const nextMemo = schedule[currentIndex + 1].memo || '（項目名なし）';

            els.currentItem.textContent = currentMemo;
            els.currentItemTime.textContent = schedule[currentIndex].time;
            els.nextItem.textContent = nextMemo;
            els.nextItemTime.textContent = schedule[currentIndex + 1].time;
            els.statusMessage.textContent = '';
            els.countdownCaption.textContent = `次の「${nextMemo}」まで`;
            els.progressBar.style.width = `${Math.max(0, Math.min(100, remainingSec / durationSec * 100))}%`;
            els.countdown.textContent = `${String(Math.floor(remainingSec / 60)).padStart(2, '0')}:${String(Math.floor(remainingSec % 60)).padStart(2, '0')}`;
            highlightSchedule(currentIndex, currentIndex + 1);
            return;
        }

        if (nowMinutes < schedule[0].minutes) {
            const remainingSec = Math.max(0, schedule[0].minutes * 60 - nowSecondsOfDay);
            els.currentItem.textContent = '開始前';
            els.currentItemTime.textContent = '--:--';
            els.nextItem.textContent = schedule[0].memo || '（項目名なし）';
            els.nextItemTime.textContent = schedule[0].time;
            els.statusMessage.textContent = '開始時刻を待っています…';
            els.progressBar.style.width = '100%';
            els.countdown.textContent = `${String(Math.floor(remainingSec / 60)).padStart(2, '0')}:${String(Math.floor(remainingSec % 60)).padStart(2, '0')}`;
            els.countdownCaption.textContent = '開始まで';
            highlightSchedule(null, 0);
            return;
        }

        const last = schedule[schedule.length - 1];
        els.currentItem.textContent = last.memo || '終了';
        els.currentItemTime.textContent = last.time;
        els.nextItem.textContent = '--';
        els.nextItemTime.textContent = '--:--';
        els.statusMessage.textContent = 'すべての予定が終了しました';
        els.progressBar.style.width = '0%';
        els.countdown.textContent = '00:00';
        els.countdownCaption.textContent = '終了';
        highlightSchedule(schedule.length - 1, null);
        setTimerState(false, { commitEditor: false });
    }

    restoreNumericSettings();
    restoreFilenameSetting();
    loadData();
    renderIdle();
    setInterval(updateTime, 250);
    if (safeStorageGet('barTimerIsRunning') === 'true') setTimerState(true, { commitEditor: false });
})();

</script>
</body>
</html>
